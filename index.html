<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1d21;--sub:#686a72;--line:#e1e0da;--acc:#2f5bd3;--acc2:#e8eefc;--box:#f0efe9;--ok:#1f8a4c;--ok2:#e3f4ea;--warn:#b5560b;--warn2:#fdf0e3;--red:#b42318;--red2:#fde8e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 80px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--box);color:var(--ink)}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
a{color:var(--acc)}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:16px;margin:0 0 8px}
.d{font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.hd{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.av{width:62px;height:62px;border-radius:16px;background:var(--box);flex:none;display:grid;place-items:center;overflow:hidden;font-size:26px;font-weight:700;color:var(--sub)}
.av img{width:100%;height:100%;object-fit:contain}
.hd h1{font-size:20px;margin:0;line-height:1.3}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--red2);color:var(--red);font-size:13px;font-weight:700;margin-top:3px}
.pill.su{background:var(--acc2);color:var(--acc)}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--bg);padding:6px 0 10px}
.tabs button{background:var(--card);color:var(--sub);border:1px solid var(--line);padding:9px 0;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.banner{border-radius:12px;padding:10px 12px;background:var(--acc2);font-size:14px;margin:0 0 12px}
.banner.c{background:var(--red2)}
.banner.ok{background:var(--ok2)}
.today{font-weight:700;font-size:15px;margin:0 0 6px}
.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:2px}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1;color:transparent;margin-top:1px;background:var(--card);padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.auto{cursor:default}
.tk{flex:1;min-width:0}
.tk .t{font-weight:600;line-height:1.4}
.task.done .tk .t{color:var(--sub)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--box);color:var(--sub);margin-top:4px}
.chip.ok{background:var(--ok2);color:var(--ok)}
.chip.go{background:var(--warn2);color:var(--warn)}
a.go{flex:none;align-self:center;font-size:14px;padding:7px 12px;text-decoration:none;border-radius:9px;background:var(--acc);color:#fff;font-weight:600}
.task.done a.go{background:var(--box);color:var(--ink)}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:5px;vertical-align:1px;white-space:nowrap}
.t1{background:var(--red2);color:var(--red)}.t2{background:var(--acc2);color:var(--acc)}.t3{background:var(--box);color:var(--sub)}.t4{background:#efe6fb;color:#6d3fc0}.t5{background:var(--ok2);color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--box);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin:0 0 10px}
ul.st{margin:0;padding-left:20px}
ul.st li{margin:4px 0}
details summary{cursor:pointer;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .h{font-size:12px;color:var(--sub);text-align:center;padding:2px 0}
.cal .c{min-height:62px;border-radius:8px;background:var(--card);border:1px solid var(--line);padding:3px 3px 2px;font-size:10.5px;line-height:1.25;overflow:hidden;text-align:left;color:var(--ink);font-weight:400;display:block}
.cal .c.x{visibility:hidden}
.cal .c .n{font-weight:700;font-size:12px;display:flex;justify-content:space-between;gap:2px}
.cal .c .n s{text-decoration:none;color:var(--acc);font-weight:600;font-size:10px}
.cal .c.td{outline:2px solid var(--acc);outline-offset:-1px}
.cal .c.sel{background:var(--acc2)}
.cal .c.ex{background:var(--red2);border-color:#f3b4b4}
.cal .c.off .n{color:var(--sub)}
.cal .c .g{color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.cal .c .r{color:var(--ok);font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.mnav button{padding:6px 12px}
.mnav b{font-size:17px}
.seg{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:7px;margin:3px 3px 0 0;background:var(--box);color:var(--sub)}
.seg.do{background:var(--acc2);color:var(--acc);font-weight:600}
.seg.ok{background:var(--ok2);color:var(--ok)}
.seg.todo{background:var(--box);color:var(--sub)}
.bk{padding:10px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0;padding-top:0}
.kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.pr{margin:8px 0 0}
.pr .l{display:flex;justify-content:space-between;font-size:13px;margin:0 0 3px}
#msg{margin-top:8px;font-size:14px;color:var(--red);min-height:1em}
.sug button{margin:0 6px 6px 0;background:var(--acc2);color:var(--acc)}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:18px}
.foot button{background:none;color:var(--sub);text-decoration:underline;font-weight:400;padding:4px}
#pv{margin:0 0 10px}
#pv select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);width:100%}
</style>

  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
