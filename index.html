<script>/* 시험앱을 열었다 돌아올 때: 그 앱의 「‹ 전체 앱」이 이 앱으로 오게 hub:back을 바꿔 두었으므로, 이 앱 자신의 단추는 원래 통합앱 주소로 되돌린다 */
(function () { try { var me = location.origin + location.pathname, b = sessionStorage.getItem('hub:back');
  if (b && b.indexOf(me) !== 0) sessionStorage.setItem('today:hub', b);
  var h = sessionStorage.getItem('today:hub'); if (h) sessionStorage.setItem('hub:back', h); else if (b && b.indexOf(me) === 0) sessionStorage.removeItem('hub:back'); } catch (e) {} })();
</script>

<script>/* 홈 화면 앱(pwa.py): 아이폰이 아니면 manifest를 건다 · 주소의 ?dv=기기ID 는 저장된 ID가 없을 때만 받는다 */
(function () {
  var K = "ex:leess-today-2026:device", ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (!/Android/i.test(ua) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
  try {
    var q = new URLSearchParams(location.search), dv = q.get('dv');
    if (dv === null && !q.has('openExternalBrowser')) return;
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var inapp = /KAKAOTALK|\bLine\//i.test(ua);
    if (dv && /^[0-9a-f]{8}$/i.test(dv) && (app || (q.get('via') === 'out' && !inapp)) && !localStorage.getItem(K)) localStorage.setItem(K, JSON.stringify(dv));
    ['dv', 'via', 'openExternalBrowser'].forEach(function (k) { q.delete(k); });
    var s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  } catch (e) {}
})();
</script>

    var menu = '화면 위나 아래의 <b>⋯</b> 또는 <b>⋮</b> 메뉴 → <b>다른 브라우저로 열기</b>' + (v.ios ? '(또는 <b>Safari로 열기</b>)' : '');
    var again = '새로 열린 화면에서 <b>📲 방법 보기</b>를 한 번 더 누르세요.';
    if (v.k === 'kakao' || v.k === 'line') return '<p>' + (v.k === 'kakao' ? '카카오톡' : 'LINE') + ' 안의 화면에서는 홈 화면에 추가할 수 없습니다. 먼저 <b>' + (v.ios ? 'Safari' : '인터넷 앱(크롬·삼성 인터넷)') + '</b>로 여세요.</p>' +
      '<button type="button" class="pwa-go" id="pwaOut">' + (v.ios ? 'Safari로 열기' : '브라우저로 열기') + '</button>' +
      '<p class="pwa-s">버튼을 눌러도 넘어가지 않으면: ' + menu + '</p><p>' + again + '</p>';
    if (v.k === 'inapp') return '<p>이 앱 안의 화면에서는 홈 화면에 추가할 수 없습니다.</p><ol><li>' + menu + '</li><li>' + again + '</li></ol>';
    if (v.k === 'ios') return '<ol><li>주소창 옆의 <b>공유</b> 버튼 ' + SHARE + '을 누르세요.<br><span class="pwa-s">공유 버튼이 안 보이면 주소창의 <b>⋯</b>를 먼저 누르세요.</span></li>' +
      '<li>목록을 위로 올려 <b>홈 화면에 추가</b>를 누르세요.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝입니다.</li></ol>' +
      '<p class="pwa-s">아이폰은 홈 화면 앱을 따로 저장합니다. 아이콘으로 처음 열 때 이름과 동의를 한 번 더 하고, 그 뒤로는 <b>아이콘으로만</b> 여세요.</p>';
    if (deferred) return '<p>아래 버튼을 누르고 <b>설치</b>를 누르면 끝입니다.</p><button type="button" class="pwa-go" id="pwaInstall">앱 설치</button>';
    if (v.k === 'samsung') return '<ol><li>화면 아래 <b>≡</b> 메뉴를 누르세요.</li><li><b>페이지 추가</b>(또는 <b>현재 페이지 추가</b>) → <b>홈 화면</b>을 누르세요.</li><li><b>추가</b>를 누르면 끝입니다.</li></ol>';
    if (v.k === 'android') return '<ol><li>오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li><li><b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.</li><li><b>설치</b>(또는 <b>추가</b>)를 누르면 끝입니다.</li></ol>';
    return '<p>휴대폰에서 이 주소를 열어 추가하세요. 컴퓨터(크롬·엣지)에서는 주소창 오른쪽의 <b>설치</b> 아이콘을 누르면 됩니다.</p>';
  }
  function show(v) {
    var real = !v; v = v || env();
    $('pwaBody').innerHTML = body(v);
    var out = $('pwaOut'), ins = $('pwaInstall');
    if (out) out.onclick = function () { location.href = v.k === 'kakao' ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(outUrl()) : outUrl('openExternalBrowser=1'); };
    if (ins) ins.onclick = function () { var p = deferred; deferred = null; p.prompt(); p.userChoice.then(function (c) { if (c.outcome === 'accepted') hide(); }).catch(function () {}); };
    if (real && v.k === 'ios' && dev() && saved === null) { saved = location.href; history.replaceState(history.state, '', base + '?dv=' + dev()); }   // 아이폰: 추가할 때의 주소에 기기ID
    $('pwaSheet').hidden = false;
  }
  function hide() { $('pwaSheet').hidden = true; if (saved !== null) { history.replaceState(history.state, '', saved); saved = null; } }
  window.PWA = {env: env, show: function (u) { show(env(u)); }};   // 점검용: PWA.show('… KAKAOTALK …')
  $('pwaClose').onclick = hide;
  $('pwaSheet').addEventListener('click', function (e) { if (e.target === this) hide(); });
  var home = $('home'), bar = $('pwaBar'), link = $('pwaLink'), notice = $('notice');
  if (app || !home) return;
  home.insertBefore(bar, notice && notice.parentNode === home ? notice.nextSibling : home.firstChild);
  home.appendChild(link);
  var off = false; try { off = localStorage.getItem(HIDE) === '1'; } catch (e) {}
  bar.hidden = off || env().k === 'pc';
  link.hidden = false;
  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
  addEventListener('appinstalled', function () { bar.hidden = link.hidden = true; hide(); });
})();
</script>

<script>/* 통합앱에서 열었을 때만 맨 위에 「‹ 전체 앱」(hubback.py) */
(function () {
  var u; try { u = sessionStorage.getItem('hub:back'); } catch (e) {}
  if (!u || u.indexOf(location.origin + '/') !== 0) return;
  var box = document.createElement('div'), a = document.createElement('a');
  box.setAttribute('style', 'max-width:780px;margin:0 auto;padding:10px 16px 0');
  a.id = 'hubBack'; a.href = u; a.textContent = '‹ 전체 앱';
  a.setAttribute('style', 'display:inline-block;padding:6px 14px 6px 10px;border:1px solid var(--line,#e1e0da);border-radius:999px;background:var(--card,#fff);color:var(--acc,#2f5bd3);font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-decoration:none');
  a.onclick = function (e) {
    var t = document.getElementById('test'), h = document.getElementById('home');   // 시험 화면이 있는 앱은 그것으로, 없으면 첫 화면이 보이는지로
    var idle = t ? (t.hidden || t.offsetParent === null) : (!!h && !h.hidden && h.offsetParent !== null);
    if (!idle && !confirm('전체 앱 목록으로 돌아갈까요?\n지금 푸는 문제는 이어서 풀 수 없을 수도 있습니다.')) e.preventDefault();
  };
  box.appendChild(a);
  document.body.insertBefore(box, document.body.firstChild);
  // 선생님 앱(leess-teacher)에서 왔으면 선생님 화면을 바로 연다(코드는 선생님 앱이 이 앱의 코드 자리에 넣어 두었다). 한 번만.
  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
