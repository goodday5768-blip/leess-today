  function hide() { $('pwaSheet').hidden = true; if (saved !== null) { history.replaceState(history.state, '', saved); saved = null; } }
  window.PWA = {env: env, show: function (u) { show(env(u)); }};   // 점검용: PWA.show('… KAKAOTALK …')
  $('pwaClose').onclick = hide;
  $('pwaSheet').addEventListener('click', function (e) { if (e.target === this) hide(); });
  var home = $('home'), bar = $('pwaBar'), link = $('pwaLink'), notice = $('notice');
  if (app || !home) return;
  home.insertBefore(bar, notice && notice.parentNode === home ? notice.nextSibling : home.firstChild);
  home.appendChild(link);
  var off = false; try { off = localStorage.getItem(HIDE) === '1'; } catch (e) {}
  bar.hidden = off || env().k === 'pc';
  link.hidden = false;
  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
  addEventListener('appinstalled', function () { bar.hidden = link.hidden = true; hide(); });
})();
</script>

<script>/* 통합앱에서 열었을 때만 맨 위에 「‹ 전체 앱」(hubback.py) */

  var u; try { u = sessionStorage.getItem('hub:back'); } catch (e) {}

  };

  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
