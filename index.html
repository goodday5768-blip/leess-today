<script>/* 시험앱을 열었다 돌아올 때: 그 앱의 「‹ 전체 앱」이 이 앱으로 오게 hub:back을 바꿔 두었으므로, 이 앱 자신의 단추는 원래 통합앱 주소로 되돌린다 */
(function () { try { var me = location.origin + location.pathname, b = sessionStorage.getItem('hub:back');
  if (b && b.indexOf(me) !== 0) sessionStorage.setItem('today:hub', b);
  var h = sessionStorage.getItem('today:hub'); if (h) sessionStorage.setItem('hub:back', h); else if (b && b.indexOf(me) === 0) sessionStorage.removeItem('hub:back'); } catch (e) {} })();

    if (!enc) { showLogin(); $('#name').value = name; msg('명단에서 찾지 못했어요. 이름을 정확히 썼는지 확인하고, 그래도 안 되면 선생님께 말해 주세요.'); return; }
    if (store.get('consent', '') !== consentId()) { pendingName = name; $('#login').hidden = true; $('#consentV').textContent = '동의 문구 ' + consentId(); $('#consentCard').hidden = false; return; }
    let data = null, key = store.get('k:' + h, '');
    // 11-09 이름 잠금: 이 기기의 주인 이름(me — 잠금 서버가 허용한 이름)이 아니면 저장된 열쇠가 있어도 그냥 열지 않고 서버 확인을 다시 받는다(거부되면 열쇠를 지운다). 선생님 기기(tdev)는 예외.
    // 잠금 서버를 아직 본 적 없는 기기(lk 없음)는 서버가 옛 판이거나 연결이 안 될 때만 예전처럼 저장된 열쇠로 연다.
    const me = store.get('me', ''), lk = store.get('lk', '') === '1', trust = store.get('tdev', '') === '1' || me === h;
    if (key && trust) { try { data = await openBlob(key, enc); } catch (e) { store.del('k:' + h); key = ''; } }
    if (!data) {
      if (!$('#login').hidden || true) { $('#app').hidden = true; $('#login').hidden = false; }
      await teacherSync();   // 선생님 코드가 있는 브라우저면 먼저 이 기기를 선생님 기기로 등록(없으면 아무 일도 안 한다)
      const g = await gate(name);
      if (g && g.lock) { store.set('lk', '1');
        if (g.allow === true) { if (g.status === '선생님') store.set('tdev', '1'); else store.set('me', h); }
        else if (g.status === '이름 다름' || g.status === '차단') { store.del('k:' + h); key = ''; } }
      else if (key && !lk && (!g || g.offline || g.allow === true)) { try { data = await openBlob(key, enc); } catch (e) { store.del('k:' + h); key = ''; } }
      if (!data) {   // (data가 있으면 옛 서버·연결 안 됨이라 저장된 열쇠로 연 것)
      if (!g || !g.allow) { showLogin(); $('#name').value = name; msg(g && g.offline ? '인터넷에 연결된 뒤 다시 눌러 주세요.' : (g && g.msg) || '지금은 열 수 없어요. 선생님께 말해 주세요.'); return; }
      if (!g.key && key) g.key = key;
      if (!g.key) { showLogin(); msg('서버에서 열쇠를 받지 못했어요. 선생님께 말해 주세요.'); return; }
      try { data = await openBlob(g.key, enc); store.set('k:' + h, g.key); } catch (e) { showLogin(); msg('자료를 여는 중 문제가 생겼어요. 선생님께 말해 주세요.'); return; }
      }

    if (store.get('openDay', '') !== TODAY) { store.set('openDay', TODAY); report('open', {name, range: '오늘 할 일'}); }

}
