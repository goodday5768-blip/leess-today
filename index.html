<script>/* 시험앱을 열었다 돌아올 때: 그 앱의 「‹ 전체 앱」이 이 앱으로 오게 hub:back을 바꿔 두었으므로, 이 앱 자신의 단추는 원래 통합앱 주소로 되돌린다 */
(function () { try { var me = location.origin + location.pathname, b = sessionStorage.getItem('hub:back');
  if (b && b.indexOf(me) !== 0) sessionStorage.setItem('today:hub', b);
  var h = sessionStorage.getItem('today:hub'); if (h) sessionStorage.setItem('hub:back', h); else if (b && b.indexOf(me) === 0) sessionStorage.removeItem('hub:back'); } catch (e) {} })();

.ink-l .sel{fill:rgba(30,102,245,.06);stroke:#1e66f5;stroke-width:1.2;stroke-dasharray:5 4}
.ink-l .hd{fill:#fff;stroke:#1e66f5;stroke-width:2}
.ink-l path.lasso{stroke:#1e66f5;stroke-width:1.4;stroke-dasharray:5 4;fill:rgba(30,102,245,.05)}
.ink-pad{position:relative;margin-top:12px;border-top:1px dashed rgba(128,128,128,.6);background:repeating-linear-gradient(transparent 0 31px,rgba(128,128,128,.22) 31px 32px)}
.ink-pad button{position:absolute;right:2px;top:4px;width:30px;min-height:30px;height:30px;margin:0;padding:0;border:1px solid rgba(128,128,128,.5);border-radius:50%;background:rgba(255,255,255,.9);color:#555;font:16px/1 sans-serif}
.ink-pad button::before{content:"×"}
.ink-tb{position:absolute;z-index:5}
.ink-tb .mv{position:absolute;left:0;top:-34px;width:32px;height:30px;border-radius:8px;background:#1e66f5;color:#fff;font:17px/30px sans-serif;text-align:center;touch-action:none;cursor:move;-webkit-user-select:none;user-select:none}
.ink-ta{display:block;margin:0;padding:1px 4px;border:1px dashed #1e66f5;border-radius:4px;font-family:inherit;font-weight:500;line-height:1.3;white-space:pre;overflow:hidden;resize:none;outline:none;box-sizing:content-box;min-height:0}
#inkTop{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
#inkLive{position:fixed;left:0;top:0;pointer-events:none;z-index:69}
#inkTop path{fill:none;stroke:#ff2d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px #ff2d2d);transition:opacity .6s}
#inkTop circle{fill:rgba(120,120,120,.18);stroke:rgba(90,90,90,.7);stroke-width:1}
#inkBar{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;flex-wrap:nowrap;gap:4px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;box-sizing:border-box;padding:calc(5px + env(safe-area-inset-top)) 8px 5px;background:rgba(255,255,255,.97);border-bottom:1px solid rgba(0,0,0,.16);box-shadow:0 2px 10px rgba(0,0,0,.12);color:#222;font:14px/1 -apple-system,"Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
#inkBar::-webkit-scrollbar{display:none}
#inkBar>*{flex:none}
#inkBar.fold{left:auto;right:6px;top:calc(6px + env(safe-area-inset-top));padding:4px;border:1px solid rgba(0,0,0,.14);border-radius:12px}
#inkBar .lb{font-size:12px;color:#666;padding:0 2px;white-space:nowrap}
body.ink-top{border-top:var(--ink-h,0px) solid transparent}
#inkBar[hidden]{display:none}
#inkBar button{min-height:36px;width:auto;margin:0;padding:7px 9px;border:1px solid rgba(0,0,0,.16);border-radius:9px;background:#fff;color:#222;font:inherit;line-height:1;white-space:nowrap}
#inkBar button.on{outline:2px solid #1e66f5;outline-offset:-2px;font-weight:700}
#inkBar button:disabled{opacity:.35}
#inkBar .h{background:#1e66f5;color:#fff;border-color:#1e66f5;font-weight:700}
#inkBar .d{width:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
#inkBar .d i{display:block;border-radius:50%;width:18px;height:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
#inkBar .o{display:contents}
#inkBar.fold>:not(.h){display:none}
#inkSt{font-size:11px;color:#777;white-space:nowrap;padding:0 2px;margin-left:auto}

  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
