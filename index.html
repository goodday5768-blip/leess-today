<script>/* 시험앱을 열었다 돌아올 때: 그 앱의 「‹ 전체 앱」이 이 앱으로 오게 hub:back을 바꿔 두었으므로, 이 앱 자신의 단추는 원래 통합앱 주소로 되돌린다 */
(function () { try { var me = location.origin + location.pathname, b = sessionStorage.getItem('hub:back');
  if (b && b.indexOf(me) !== 0) sessionStorage.setItem('today:hub', b);
  var h = sessionStorage.getItem('today:hub'); if (h) sessionStorage.setItem('hub:back', h); else if (b && b.indexOf(me) === 0) sessionStorage.removeItem('hub:back'); } catch (e) {} })();

    const me = store.get('me', ''), lk = store.get('lk', '') === '1', trust = store.get('tdev', '') === '1' || me === h;
    if (key && trust) { try { data = await openBlob(key, enc); } catch (e) { store.del('k:' + h); key = ''; } }
    if (!data) {
      if (!$('#login').hidden || true) { $('#app').hidden = true; $('#login').hidden = false; }
      await teacherSync();   // 선생님 코드가 있는 브라우저면 먼저 이 기기를 선생님 기기로 등록(없으면 아무 일도 안 한다)
      const g = await gate(name);
      if (g && g.lock) { store.set('lk', '1');
        if (g.allow === true) { if (g.status === '선생님') store.set('tdev', '1'); else store.set('me', h); }
        else if (g.status === '이름 다름' || g.status === '차단') { store.del('k:' + h); key = ''; } }
      else if (key && !lk && (!g || g.offline || g.allow === true)) { try { data = await openBlob(key, enc); } catch (e) { store.del('k:' + h); key = ''; } }
      if (!data) {   // (data가 있으면 옛 서버·연결 안 됨이라 저장된 열쇠로 연 것)
      if (!g || !g.allow) { showLogin(); $('#name').value = name; msg(g && g.offline ? '인터넷에 연결된 뒤 다시 눌러 주세요.' : (g && g.msg) || '지금은 열 수 없어요. 선생님께 말해 주세요.'); return; }
      if (!g.key && key) g.key = key;
      if (!g.key) { showLogin(); msg('서버에서 열쇠를 받지 못했어요. 선생님께 말해 주세요.'); return; }
      try { data = await openBlob(g.key, enc); store.set('k:' + h, g.key); } catch (e) { showLogin(); msg('자료를 여는 중 문제가 생겼어요. 선생님께 말해 주세요.'); return; }
      }
    }
    store.set('name', name); S = data; msg(''); schWho = [name, store.get('k:' + h, '')]; schOv = null; schAt = 0;
    if (store.get('openDay', '') !== TODAY) { store.set('openDay', TODAY); report('open', {name, range: '오늘 할 일'}); }
    render();
  } finally { $('#go').disabled = false; }
}

// ── 이벤트 ──
document.addEventListener('click', e => {
  const sm = e.target.closest('[data-schm]'); if (sm) { const v = sm.dataset.schm; if (v === 'full') { schFull = !schFull; schJump = true; vNae(); } else gcScrollTo(TODAY.slice(0, 7), true); return; }
  const t = e.target.closest('[data-t]'); if (t && t.closest('#tabs')) { tab = t.dataset.t; if (tab === 'nae') schJump = true; render(); if (!schJump) window.scrollTo(0, 0); return; }
  const c = e.target.closest('[data-ck]'); if (c) { toggle(TODAY, c.dataset.ck); return; }
  const d = e.target.closest('[data-day]'); if (d) { const pl = d.classList.contains('pd'); selDay = selDay === d.dataset.day && !pl ? null : d.dataset.day; if (pl) calM = selDay.slice(0, 7); tab === 'nae' ? vNae() : vCal(); if (pl) { const s = document.getElementById('sdet'); if (s) s.scrollIntoView({block: 'start', behavior: 'smooth'}); } return; }
  const s = e.target.closest('[data-sug]'); if (s) { $('#name').value = s.dataset.sug; login(s.dataset.sug); return; }
  const g = e.target.closest('a[data-go]'); if (g) { try { sessionStorage.setItem('hub:back', location.origin + location.pathname); } catch (x) {} }
});
teacherSync();   // 11-09: 선생님 코드가 있는 브라우저는 열 때마다 새로 생긴 기기ID(다른 앱 포함)를 선생님 기기로 등록
$('#go').onclick = () => login($('#name').value);
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') login($('#name').value); });
$('#consentOk').onclick = () => { store.set('consent', consentId()); report('consent', {name: pendingName, range: '동의 문구 ' + consentId()}); $('#consentCard').hidden = true; login(pendingName); };
$('#consentNo').onclick = () => { $('#consentCard').hidden = true; showLogin(); $('#msg').textContent = '동의해야 열 수 있어요.'; };
$('#switch').onclick = () => { if (PRE) return; store.del('name'); S = null; tab = 'today'; $('#name').value = ''; showLogin(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) render(); });
window.addEventListener('pageshow', () => { if (S) render(); });
/* 11-07: 예전 화면을 메모리에 들고 있으면(옛 캐릭터 등) 새 빌드가 있을 때 새로 불러온다 */
async function newBuild() { try { if (!D.built) return; const t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'})).text(); const m = t.match(/"built": "([^"]+)"/); if (m && m[1] !== D.built) location.replace(location.pathname + '?b=' + encodeURIComponent(m[1]) + location.hash); } catch (e) {} }
window.addEventListener('pageshow', newBuild); document.addEventListener('visibilitychange', () => { if (!document.hidden) newBuild(); });
window.addEventListener('storage', () => { if (S) render(); });

// ── 시작 ──
$('#consentP').innerHTML = D.consent || '';
$('#noticeP').textContent = D.notice || '';
if (PRE) {
  $('#pv').hidden = false; $('#switch').hidden = true;
  const names = Object.keys(PRE);
  $('#pvSel').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  $('#pvSel').onchange = () => { S = PRE[$('#pvSel').value]; selDay = null; calM = null; render(); };
  S = PRE[names[0]]; render();
} else {
  const n = store.get('name', '');
  if (n) login(n); else showLogin();
}
</script>

<script>/* 홈 화면 앱 설치 안내(pwa.py) — 홈 화면 앱으로 열었으면 막대·링크가 보이지 않는다 */
(function () {

  var SHARE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="공유"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>';
  function env(u) {
    var fake = !!u; u = u || UA;
    var ios = /iP(hone|ad|od)/.test(u) || (!fake && !/Android/i.test(u) && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (/NAVER\(inapp|Instagram|FBAN|FBAV|DaumApps|BAND\/|everytimeApp|; wv\)/i.test(u) || (ios && !/Safari\//.test(u))) return {k: 'inapp', ios: ios};
    if (ios) return {k: 'ios', ios: true};

  function outUrl(extra) { var d = dev(), p = d ? ['dv=' + d, 'via=out'] : []; if (extra) p.push(extra); return base + (p.length ? '?' + p.join('&') : ''); }
  function body(v) {
    var menu = '화면 위나 아래의 <b>⋯</b> 또는 <b>⋮</b> 메뉴 → <b>다른 브라우저로 열기</b>' + (v.ios ? '(또는 <b>Safari로 열기</b>)' : '');
    var again = '새로 열린 화면에서 <b>📲 방법 보기</b>를 한 번 더 누르세요.';
    if (v.k === 'kakao' || v.k === 'line') return '<p>' + (v.k === 'kakao' ? '카카오톡' : 'LINE') + ' 안의 화면에서는 홈 화면에 추가할 수 없습니다. 먼저 <b>' + (v.ios ? 'Safari' : '인터넷 앱(크롬·삼성 인터넷)') + '</b>로 여세요.</p>' +
      '<button type="button" class="pwa-go" id="pwaOut">' + (v.ios ? 'Safari로 열기' : '브라우저로 열기') + '</button>' +
      '<p class="pwa-s">버튼을 눌러도 넘어가지 않으면: ' + menu + '</p><p>' + again + '</p>';
    if (v.k === 'inapp') return '<p>이 앱 안의 화면에서는 홈 화면에 추가할 수 없습니다.</p><ol><li>' + menu + '</li><li>' + again + '</li></ol>';
    if (v.k === 'ios') return '<ol><li>주소창 옆의 <b>공유</b> 버튼 ' + SHARE + '을 누르세요.<br><span class="pwa-s">공유 버튼이 안 보이면 주소창의 <b>⋯</b>를 먼저 누르세요.</span></li>' +
      '<li>목록을 위로 올려 <b>홈 화면에 추가</b>를 누르세요.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝입니다.</li></ol>' +
      '<p class="pwa-s">아이폰은 홈 화면 앱을 따로 저장합니다. 아이콘으로 처음 열 때 이름과 동의를 한 번 더 하고, 그 뒤로는 <b>아이콘으로만</b> 여세요.</p>';
    if (deferred) return '<p>아래 버튼을 누르고 <b>설치</b>를 누르면 끝입니다.</p><button type="button" class="pwa-go" id="pwaInstall">앱 설치</button>';
    if (v.k === 'samsung') return '<ol><li>화면 아래 <b>≡</b> 메뉴를 누르세요.</li><li><b>페이지 추가</b>(또는 <b>현재 페이지 추가</b>) → <b>홈 화면</b>을 누르세요.</li><li><b>추가</b>를 누르면 끝입니다.</li></ol>';

  $('pwaHow').onclick = link.onclick = function () { show(); };
  $('pwaX').onclick = function () { bar.hidden = true; try { localStorage.setItem(HIDE, '1'); } catch (e) {} };
  addEventListener('appinstalled', function () { bar.hidden = link.hidden = true; hide(); });
})();
</script>
